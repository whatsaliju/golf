name: Deploy to GitHub Pages

# Builds the Vite app in the cloud and publishes it to GitHub Pages, so you can
# view the flyover as a plain URL with nothing installed locally.
#
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source = "GitHub Actions". (Free Pages requires a public repo, or GitHub Pro
# for a private one.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Pre-fetch all hole data from Overpass ONCE at build time and bake it to
      # static JSON, so the deployed site makes zero live Overpass calls. Non-
      # fatal: if Overpass is down now, the site just fetches live at runtime.
      - run: npm run bake:all
        continue-on-error: true
      # Relative base ("./") so one build works at any path: the bare
      # *.github.io/<repo>/ URL, a custom subdomain root (golf.lijuvarughese.com),
      # or a Bluehost /golf/ subfolder.
      - run: npm run build
        env:
          VITE_BASE: ./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
